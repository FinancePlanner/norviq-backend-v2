      responses:
        '200':
          description: Comparison set normalized to elapsed days and percentage change
          content:
            application/json:
              schema:
                type: object
                required: [runs, series]
                properties:
                  runs:
                    type: array
                    minItems: 1
                    maxItems: 4
                    items: { $ref: '#/components/schemas/ScenarioRun' }
                  series:
                    type: array
                    minItems: 1
                    maxItems: 4
                    items:
                      type: object
                      required: [runId, points]
                      properties:
                        runId: { type: string, format: uuid }
                        points:
                          type: array
                          items:
                            type: object
                            required: [elapsedDays, value, percentageChange]
                            properties:
                              elapsedDays: { type: number, format: double, minimum: 0 }
                              value: { type: number, format: double }
                              percentageChange: { type: number, format: double }
