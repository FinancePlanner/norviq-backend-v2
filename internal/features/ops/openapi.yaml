  /v1/expenses/import:
    post:
      operationId: importExpensesCsv
      tags: [Expenses]
      summary: Import expenses from CSV
      description: >-
        Accepts a CSV body with the header `title,amount,currency,pillar,
        category,occurred_on[,external_id]`. Defaults to a dry run: pass
        `dry_run=false` to actually write. Rows are classified individually, so
        one bad row does not fail the batch. Duplicates are matched on
        external_id when present, otherwise on date, amount and title.
        Note: the `currency` column is accepted in the header but not yet applied.
      security:
        - bearerAuth: []
      parameters:
        - name: dry_run
          in: query
          required: false
          description: Defaults to true. Set false to write the rows.
          schema:
            type: boolean
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseCsvImportResult'
        '400':
          description: Malformed CSV, missing required headers, or too many rows
        '401':
          description: Unauthorized
        '413':
          description: CSV exceeds the size limit

  /v1/expenses/export.csv:
    get:
      operationId: exportExpensesCsv
      tags: [Expenses]
      summary: Export expenses as CSV
      description: Returns a UTF-8 CSV with a BOM, ordered by date.
      security:
