      type: object
      properties:
        sessionId:
          type: string
        fileName:
          type: string
        expiresAt:
          type: string
          description: ISO-8601. After this the session is gone and the file must be re-uploaded.
        sheets:
          type: array
          items:
            $ref: '#/components/schemas/SpreadsheetImportSheet'
        categoryMappings:
          type: array
          items:
            $ref: '#/components/schemas/SpreadsheetImportCategoryMapping'
        amountSign:
