        Why an assistant message exists. Absent on user messages and on rows written before
        standing tasks existed; clients treat absent as `reply`. `proactive` messages were posted
        by the server (a standing task, a daily tip) and carry `sourceLabel`.

    AIWatchProposalResponse:
      type: object
      description: >-
        A standing task the assistant offers to create. Travels with a pending action whose
        `toolName` is `create_watch`; confirm or cancel it with the pending-action routes.
      properties:
        title:
          type: string
        scheduleHuman:
          type: string
          description: Human schedule, e.g. "Every day at 8:00" or "Every hour".
        intervalMinutes:
          type: integer
          minimum: 60
        spec:
          type: string
          description: What the assistant checks on each run (the user's request).
      required: [title, scheduleHuman, intervalMinutes, spec]

