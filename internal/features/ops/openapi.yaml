  /v1/market/insider/{symbol}:
    parameters:
      - name: symbol
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getMarketInsiderActivity
      tags: [MarketData]
      summary: Get insider filings and any cluster-buy signal for a symbol
      description: >-
        Returns SEC Form 4 filings for the symbol inside the requested window, newest transaction first, with buy/sell
        totals and a cluster-buy signal when three or more distinct reporters bought on the open market inside a
        30-day span. `trades` is empty, `summary` is all zeros and `clusterBuy` is null when the symbol has no filings
        in the window, and also when the upstream plan does not cover insider data — an empty response is not
        evidence that no insider traded. Cached for six hours (`MARKET_TTL_OWNERSHIP_SECONDS`).
      security:
        - bearerAuth: []
      parameters:
        - name: days
          in: query
          required: false
          description: Length of the window in days. Defaults to 365.
          schema:
            type: integer
            minimum: 30
            maximum: 1825
            default: 365
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsiderActivityResponse'
        '400':
          description: Missing or invalid symbol, or `days` outside 30…1825
        '401':
          description: Unauthorized
        '503':
          description: Market data provider unavailable or misconfigured
