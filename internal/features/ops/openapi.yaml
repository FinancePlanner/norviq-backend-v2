          description: Action expired or already handled

  /v1/ai/assistant/actions/{id}/cancel:
    post:
      operationId: cancelAIPendingAction
      tags: [AI]
      summary: Cancel a pending assistant action
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Cancelled
        '409':
          description: Action already handled

  /v1/ai/credentials:
    get:
      operationId: listAICredentials
      tags: [AI]
      summary: List the caller's stored LLM provider credentials
      description: >
        Never returns the API key itself. Requires a first-party session; a
        personal access token is rejected with 403.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Stored credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAIProviderCredentialListResponse'
        '403':
          description: Personal access tokens may not manage credentials
        '503':
          description: Bring-your-own-key is disabled
    post:
      operationId: createAICredential
      tags: [AI]
      summary: Store or replace an LLM provider credential
      description: >
        Upserts on (user, provider), so re-submitting rotates the key rather
        than conflicting. The plaintext key is never echoed back: the caller
        supplied it and already has a copy.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserAIProviderCredentialRequest'
      responses:
        '200':
          description: Existing credential replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAIProviderCredential'
        '201':
          description: Credential stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAIProviderCredential'
        '400':
          description: >
            Invalid provider, label, or key; or a baseURL that is not https or
            resolves to a private, loopback, or link-local host.
        '403':
          description: Personal access tokens may not manage credentials
        '503':
          description: Bring-your-own-key is disabled

  /v1/ai/credentials/{credentialId}/verify:
    post:
      operationId: verifyAICredential
      tags: [AI]
      summary: Re-check a stored credential against its provider
      description: >
        Returns 200 even when the key is rejected — the check itself succeeded.
        Inspect `status` and `errorCode` for the outcome.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: credentialId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyUserAIProviderCredentialResponse'
        '403':
          description: Personal access tokens may not manage credentials
        '404':
          description: Credential not found

  /v1/ai/credentials/{credentialId}:
    delete:
      operationId: deleteAICredential
      tags: [AI]
      summary: Delete a stored credential
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: credentialId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '403':
          description: Personal access tokens may not manage credentials
        '404':
          description: Credential not found

