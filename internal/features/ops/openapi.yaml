openapi: 3.0.3
info:
  title: StockPlanBackend
  description: |
    Stock planner backend.
    Finnhub-backed market data is configured on the backend with `FINNHUB_API_KEY`, `FINNHUB_WEBHOOK_URL`, and `FINNHUB_WEBHOOK_SECRET`.
    FMP-backed cash-flow, balance-sheet, ratios, growth, consensus, and sector-performance endpoints are configured on the backend with `FMP_API_KEY`.
    All direct Finnhub GET requests require either `token=<apiKey>` in the URL or `X-Finnhub-Token: <apiKey>` as a header. You can find the API key in the Finnhub Dashboard.
    All direct FMP GET requests require `apikey=<apiKey>` in the URL query string. In Bruno, set `FMP_API_KEY`.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local (docker-compose)
  - url: /
    description: Relative base URL
tags:
  - name: Health
  - name: Auth
  - name: Stocks
  - name: Watchlist
  - name: Achievements
  - name: Social
    description: The caller's own achievements, tiers, unseen unlocks and profile showcase. Gated by `ACHIEVEMENTS_ENABLED`; every route returns 404 when it is off. Copy follows `Accept-Language` (en, pt-PT). No money is ever exposed.
  - name: Recaps
    description: Per-user monthly and yearly recap decks, generated once. Gated by `RECAP_ENABLED`; every route returns 404 when it is off.
  - name: Pilots
    description: Simulated copy-trading of politicians and funds. Gated by `PILOTS_ENABLED`; every route returns 404 when it is off.
  - name: Articles
    description: User-published, ticker-tagged stock articles. Gated by `ARTICLES_ENABLED`; every route returns 404 when it is off.
  - name: Research
  - name: Targets
  - name: MarketData
  - name: Finnhub
    description: Direct Finnhub reference endpoints used by the backend market-data provider and Bruno collection examples. Backend Finnhub configuration uses `FINNHUB_API_KEY`, `FINNHUB_WEBHOOK_URL`, and `FINNHUB_WEBHOOK_SECRET`.
  - name: FMP
    description: Direct FMP reference endpoints and backend-backed FMP flows. Backend FMP configuration uses `FMP_API_KEY`.
  - name: Webhooks
    description: Public inbound webhook endpoints for provider event delivery.
  - name: Portfolio
  - name: Rebalancing
    description: Rule-based allocation policies, drift monitoring, simulations, and planning records. These endpoints never submit broker orders.
  - name: Retirement
  - name: AdvancedReporting
  - name: Scenarios
  - name: Brokers
  - name: Statistics
  - name: News
  - name: Crypto
  - name: Dashboard
  - name: AI
  - name: UserProfile
  - name: Badges
  - name: Feedback
  - name: Assets
  - name: Notifications
  - name: Tax
  - name: Billing
  - name: Export
  - name: Macro
    description: >-
      Global macro / inflation data (Nowflation parity). Country-aware via
      `?country=US|BR|PT|EA` (defaults to US). Sources — US uses FRED
      (`FRED_API_KEY`) plus optional Nowflation enrichment
      (`NOWFLATION_BASE_URL`/`NOWFLATION_SNAPSHOT_PATH`); PT/EA use Eurostat
      HICP; BR uses IBGE SIDRA. Responses fall back to stub data marked
      `source="stub"` while `MACRO_ALLOW_STUB_FALLBACK=true`.
paths:
  /v1/financing/simulations:
    post:
      operationId: simulateFinancing
      summary: Simulate one or more financing offers
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinancingSimulationRequest' }
      responses:
        '200':
          description: Financing comparison and affordability assessment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinancingSimulationResponse' }
  /v1/financing/plans:
    get:
      operationId: listFinancingPlans
      summary: List saved financing plans
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Saved plans
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/FinancingPlanResponse' } }
    post:
      operationId: createFinancingPlan
      summary: Save a financing plan
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinancingPlanRequest' }
      responses:
        '201':
          description: Saved financing plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinancingPlanResponse' }
  /v1/financing/projections:
    get:
      operationId: listFinancingProjections
      summary: List projected installments in a date range
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Projected installments
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/FinancingProjectionResponse' } }
  /health:
    get:
      operationId: health
      tags: [Health]
      summary: Application health check
      responses:
        '200':
          description: Application is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1:
    get:
      operationId: root
      tags: [Health]
      summary: API root
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
  /v1/hello:
    get:
      operationId: hello
      tags: [Health]
      summary: Hello world
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string

  /v1/auth/register:
    post:
      operationId: authRegister
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRegisterRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /v1/auth/login:
    post:
      operationId: authLogin
      tags: [Auth]
      summary: Login and receive either MFA challenge or tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AuthResponse'
                  - $ref: '#/components/schemas/AuthLoginOutcome'
  /v1/auth/forgot-password:
    post:
      operationId: authForgotPassword
      tags: [Auth]
      summary: Issue a password reset code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthForgotPasswordRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthForgotPasswordResponse'
  /v1/auth/resend-reset:
    post:
      operationId: authResendReset
      tags: [Auth]
      summary: Resend a password reset code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthForgotPasswordRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthForgotPasswordResponse'
  /v1/auth/reset-password:
    post:
      operationId: authResetPassword
      tags: [Auth]
      summary: Reset password using a reset code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthResetPasswordRequest'
      responses:
        '204':
          description: No Content
  /v1/auth/refresh:
    post:
      operationId: authRefresh
      tags: [Auth]
      summary: Refresh tokens using a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRefreshRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /v1/auth/mfa/verify:
    post:
      operationId: authMFAVerify
      tags: [Auth]
      summary: Verify MFA challenge and issue tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthMFAVerifyRequest'
      responses:
        '200':
          description: MFA verification successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid or expired challenge/code
        '429':
          description: Too many attempts
  /v1/auth/mfa/resend:
    post:
      operationId: authMFAResend
      tags: [Auth]
      summary: Resend MFA verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthMFAResendRequest'
      responses:
        '200':
          description: MFA challenge refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMFAChallengeResponse'
        '401':
          description: Invalid or expired challenge
        '429':
          description: Resend limit exceeded
  /v1/auth/oauth/{provider}/start:
    post:
      operationId: authOAuthStart
      tags: [Auth]
      summary: Start OAuth authorization flow
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/OAuthProvider'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthStartRequest'
      responses:
        '200':
          description: OAuth flow initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthStartResponse'
        '400':
          description: Invalid provider or redirect URI
        '503':
          description: OAuth provider is not configured on the backend
  /v1/auth/oauth/{provider}/exchange:
    post:
      operationId: authOAuthExchange
      tags: [Auth]
      summary: Exchange OAuth authorization code and receive either MFA challenge or tokens
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/OAuthProvider'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthExchangeRequest'
      responses:
        '200':
          description: OAuth exchange successful
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AuthResponse'
                  - $ref: '#/components/schemas/AuthLoginOutcome'
        '401':
          description: OAuth flow invalid/expired or provider verification failed
        '409':
          description: Account with this email already exists and requires linking
  /v1/auth/oauth/identities:
    get:
      operationId: authOAuthIdentities
      tags: [Auth]
      summary: List connected OAuth sign-in accounts for the authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Connected sign-in account status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthLinkedAccountsResponse'
        '401':
          description: Missing or invalid authentication token
  /v1/auth/oauth/{provider}/link/start:
    post:
      operationId: authOAuthLinkStart
      tags: [Auth]
      summary: Start an authenticated OAuth account-linking flow
      security:
        - bearerAuth: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/OAuthProvider'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthStartRequest'
      responses:
        '200':
          description: OAuth link flow initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthStartResponse'
        '400':
          description: Invalid provider or redirect URI
        '401':
          description: Missing or invalid authentication token
        '503':
          description: OAuth provider is not configured on the backend
  /v1/auth/oauth/{provider}/link/exchange:
    post:
      operationId: authOAuthLinkExchange
      tags: [Auth]
      summary: Exchange OAuth authorization code and link the provider to the authenticated account
      security:
        - bearerAuth: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/OAuthProvider'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthExchangeRequest'
      responses:
        '200':
          description: OAuth provider linked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthLinkResponse'
        '401':
          description: OAuth flow invalid/expired or missing authentication token
        '409':
          description: Provider email could not be verified for this account or provider is already linked
  /v1/auth/webauthn/login/options:
    post:
      operationId: authWebAuthnLoginOptions
      tags: [Auth]
      summary: Begin WebAuthn passkey login
      responses:
        '200':
          description: Public key credential request options
          content:
            application/json:
              schema:
                type: object
                required: [publicKey]
                properties:
                  publicKey:
                    type: object
                    description: WebAuthn PublicKeyCredentialRequestOptions
        '400':
          description: Missing or disallowed Origin header
        '503':
          description: WebAuthn is not configured on the backend
  /v1/auth/webauthn/login/verify:
    post:
      operationId: authWebAuthnLoginVerify
      tags: [Auth]
      summary: Verify WebAuthn passkey assertion and issue tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: WebAuthn AuthenticationCredential (PublicKeyCredential)
      responses:
        '200':
          description: Passkey login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Unknown passkey or invalid challenge
        '503':
          description: WebAuthn is not configured on the backend
  /v1/auth/me:
    get:
      operationId: authMe
      tags: [Auth]
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponse'
        '401':
          description: Unauthorized

  /v1/users:
    get:
      operationId: getUserProfile
      tags: [UserProfile]
      summary: Get the authenticated user profile
      description: Returns the profile for the user identified by the bearer token.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The authenticated user's profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUserProfileResponse'
        '401':
          description: Missing or invalid bearer token, or the authenticated user could not be resolved.
    put:
      operationId: updateUserProfile
      tags: [UserProfile]
      summary: Update the authenticated user profile
      description: Updates the authenticated user's profile fields. The `userProfile.id` value must match the authenticated user.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileRequest'
      responses:
        '200':
          description: The updated user profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateUserProfileResponse'
        '400':
          description: Invalid payload. Returned when the profile ID does not match the authenticated user, the email is invalid, or the username fails validation. A changed email is refused with reason `EMAIL_CHANGE_REQUIRES_REAUTH`; use `PATCH /v1/users/email`.
        '401':
          description: Missing or invalid bearer token, or the authenticated user could not be resolved.
        '409':
          description: The requested email or username is already registered to another user.
    delete:
      operationId: deleteUserProfile
      tags: [UserProfile]
      summary: Delete the authenticated user account
      description: Permanently deletes the authenticated user account identified by the bearer token.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Confirmation that the authenticated user account was deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteUserProfileResponse'
        '401':
          description: Missing or invalid bearer token, or the authenticated user could not be resolved.

  /v1/onboarding:
    get:
      operationId: getOnboardingState
      tags: [Onboarding]
      summary: Funnel position, guided-start progress and dismissal for the current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingStateDTO'
        '401':
          description: Unauthorized
    patch:
      operationId: updateOnboardingState
      tags: [Onboarding]
      summary: Record funnel position, finish the funnel, or dismiss the guided-start card
      description: >-
        Only funnelStep, funnelCompleted (true only) and guidedStartDismissed are accepted.
        Guided-start progress is set by the server when the user performs the real action.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingPatchRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingStateDTO'
        '400':
          description: A server-owned field was sent, funnelCompleted was false, or the step is unknown
        '401':
          description: Unauthorized

  /v1/users/{id}:
    get:
      operationId: getUserProfileByID
      tags: [UserProfile]
      summary: Get a user profile by id
      description: Returns the authenticated user's profile when the path id matches the bearer token user id. This route is reserved for future role-based access expansion.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: User identifier.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The requested user profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUserProfileResponse'
        '400':
          description: Invalid user id.
        '401':
          description: Missing or invalid bearer token, or the authenticated user could not be resolved.
        '403':
          description: The authenticated user is not allowed to access another user's profile.
    put:
      operationId: updateUserProfileByID
      tags: [UserProfile]
      summary: Update a user profile by id
      description: Updates the authenticated user's profile when the path id matches the bearer token user id. The `userProfile.id` value must also match that same user id.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: User identifier.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileRequest'
      responses:
        '200':
          description: The updated user profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateUserProfileResponse'
        '400':
          description: Invalid user id, invalid payload, or a profile id mismatch.
        '401':
          description: Missing or invalid bearer token, or the authenticated user could not be resolved.
        '403':
          description: The authenticated user is not allowed to update another user's profile.
        '409':
          description: The requested email or username is already registered to another user.
    delete:
      operationId: deleteUserProfileByID
      tags: [UserProfile]
      summary: Delete a user account by id
      description: Deletes the authenticated user's account when the path id matches the bearer token user id. This route is reserved for future role-based access expansion.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: User identifier.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Confirmation that the requested user account was deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteUserProfileResponse'
        '400':
          description: Invalid user id.
        '401':
          description: Missing or invalid bearer token, or the authenticated user could not be resolved.
        '403':
          description: The authenticated user is not allowed to delete another user's profile.

  /v1/users/username:
    patch:
      operationId: updateUsername
      tags: [UserProfile]
      summary: Update the authenticated user's username
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUsernameRequest'
      responses:
        '200':
          description: The updated user profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateUserProfileResponse'
        '400':
          description: Invalid username.
        '401':
          description: Unauthorized
        '409':
          description: Username already taken.

  /v1/users/email:
    patch:
      operationId: updateEmail
      tags: [UserProfile]
      summary: Update the authenticated user's email
      description: >-
        Re-authenticates with the current password. On success the new address
        is unverified and every other session (refresh tokens, personal access
        tokens, OAuth tokens) is revoked; pass `refreshToken` to keep the
        caller's own refresh token.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmailWithReauthRequest'
      responses:
        '200':
          description: The updated user profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateUserProfileResponse'
        '400':
          description: >-
            Invalid email; `currentPassword` missing (reason
            `CURRENT_PASSWORD_REQUIRED`) or wrong (reason
            `INVALID_CURRENT_PASSWORD`); or the address is the current one
            (reason `EMAIL_UNCHANGED`).
        '401':
          description: Unauthorized
        '429':
          description: More than 5 attempts a minute for this user.
        '409':
          description: >-
            Email already registered, or the account has no password it could
            re-authenticate with (OAuth-only; reason `REAUTH_REQUIRED`).

  /v1/users/password:
    patch:
      operationId: updatePassword
      tags: [UserProfile]
      summary: Update the authenticated user's password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordRequest'
      responses:
        '200':
          description: Password updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIMessageResponse'
        '400':
          description: Invalid password payload, or the current password is wrong (reason `INVALID_CURRENT_PASSWORD`).
        '401':
          description: Unauthorized
        '429':
          description: More than 5 attempts a minute for this user.

  /v1/users/ai-consent:
    get:
      operationId: getAIConsent
      tags: [UserProfile]
      summary: Whether the user consented to sending data to third-party AI providers
      description: Accepts scoped tokens with `settings:read`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The consent timestamp, or null when the user has not consented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIConsentResponse'
        '401':
          description: Unauthorized
    post:
      operationId: grantAIConsent
      tags: [UserProfile]
      summary: Consent to sending data to third-party AI providers
      description: >-
        First-party sessions only. Idempotent; a repeat keeps the original
        timestamp. While `AI_CONSENT_ENFORCED` is on, AI routes answer 403 with
        reason `AI_CONSENT_REQUIRED` until this is called.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The consent timestamp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIConsentResponse'
        '401':
          description: Unauthorized
        '403':
          description: Scoped tokens cannot grant consent.
    delete:
      operationId: withdrawAIConsent
      tags: [UserProfile]
      summary: Withdraw consent to sending data to third-party AI providers
      description: First-party sessions only. Idempotent.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Consent withdrawn; `consentedAt` is null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIConsentResponse'
        '401':
          description: Unauthorized
        '403':
          description: Scoped tokens cannot withdraw consent.

  /v1/badges:
    get:
      operationId: listBadges
      tags: [Badges]
      summary: List badge progress for the authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Badge progress list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadgesListResponse'
        '401':
          description: Unauthorized

  /v1/social/feed:
    get:
      operationId: listSocialFeed
      tags: [Social]
      summary: Friends' achievement activity feed
      description: Newest first. Only friends who share achievements appear. 404 unless social, achievements and the activity feed flag are all on.
      security:
        - bearerAuth: []
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: A page of feed items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialFeedResponseDTO'
        '400':
          description: Invalid cursor.
        '401':
          description: Unauthorized
        '404':
          description: The activity feed is disabled.

  /v1/social/feed/{activityId}/congrats:
    post:
      operationId: congratulateSocialActivity
      tags: [Social]
      summary: Congratulate a friend on an activity
      description: Returns 204 whether or not this call created the congrats. The actor is pushed only for a new one, at most once per 10 minutes per activity.
      security:
        - bearerAuth: []
      parameters:
        - { name: activityId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: Congratulated.
        '400':
          description: The activity is the caller's own.
        '401':
          description: Unauthorized
        '404':
          description: Activity not visible to the caller, or the activity feed is disabled.
        '429':
          description: Rate limited.

  /v1/social/users/{userId}/achievements:
    get:
      operationId: listSocialUserAchievements
      tags: [Social]
      summary: A friend's earned achievements
      description: 404 when the viewer may not see the owner's achievements (not a friend, blocked, suspended, or sharing turned off), so nothing leaks. Also 404 when the activity feed is disabled.
      security:
        - bearerAuth: []
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Visible unlocks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AchievementUnlock'
        '401':
          description: Unauthorized
        '404':
          description: User not visible, or the activity feed is disabled.

  /v1/achievements:
    get:
      operationId: listAchievements
      tags: [Achievements]
      summary: List achievements for the authenticated user
      description: Re-evaluates the user first unless the last evaluation is under 60 seconds old. Performance achievements never carry progress; hidden ones stay masked until earned.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Achievements, categories and summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AchievementsResponse'
        '401':
          description: Unauthorized
        '404':
          description: Achievements are disabled.

  /v1/achievements/unseen:
    get:
      operationId: listUnseenAchievements
      tags: [Achievements]
      summary: Unlocks not yet shown to the user
      description: Live and sweep unlocks with no seen timestamp, oldest first, at most 20. Backfilled unlocks never appear.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Unseen unlocks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AchievementUnlock'
        '401':
          description: Unauthorized
        '404':
          description: Achievements are disabled.

  /v1/achievements/seen:
    post:
      operationId: markAchievementsSeen
      tags: [Achievements]
      summary: Mark unlocks as seen
      description: Ids that belong to other users are silently ignored.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AchievementSeenBody'
      responses:
        '204':
          description: Marked.
        '401':
          description: Unauthorized
        '404':
          description: Achievements are disabled.
        '429':
          description: Rate limited.

  /v1/achievements/showcase:
    put:
      operationId: setAchievementShowcase
      tags: [Achievements]
      summary: Replace the profile showcase
      description: Up to 3 earned (key, tier) items, ranked 1 to n in order, by real achievement key (an opaque `hidden.<n>` key is never accepted). An empty list clears the showcase.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AchievementShowcaseBody'
      responses:
        '200':
          description: Updated achievements listing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AchievementsResponse'
        '400':
          description: More than 3 items, duplicates, or an item the caller has not earned.
        '401':
          description: Unauthorized
        '404':
          description: Achievements are disabled.
        '429':
          description: Rate limited.

