          type: string
          nullable: true
        categoryId:
          type: string
          nullable: true
      required: [sheetName, row, include]
    SpreadsheetImportDecisionRequest:
      type: object
      description: >-
        Everything the user decided. Sent to both preview and commit, which run
        the same derivation, so the two can never disagree.
      properties:
        sheets:
          type: array
          items:
            $ref: '#/components/schemas/SpreadsheetImportSheet'
        categoryMappings:
          type: array
          items:
            $ref: '#/components/schemas/SpreadsheetImportCategoryMapping'
        rowOverrides:
          type: array
          items:
            $ref: '#/components/schemas/SpreadsheetImportRowOverride'
        amountSign:
          $ref: '#/components/schemas/SpreadsheetImportAmountSign'
        dateFormat:
          type: string
          nullable: true
          description: dayFirst or monthFirst. Explicit because 03/04/2026 is ambiguous.
        decimalSeparator:
          type: string
          nullable: true
        currency:
          type: string
          nullable: true
        exchangeRates:
          type: object
          description: >-
            Rate per source currency. Rows in an unrated foreign currency are
            skipped rather than converted at par.
          additionalProperties:
            type: number
            format: double
      required: [sheets, amountSign]
