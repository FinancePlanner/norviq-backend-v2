        dateRangeStart:
          type: string
          nullable: true
        dateRangeEnd:
          type: string
          nullable: true
        totalAmount:
          type: number
          format: double
        rows:
          type: array
          items:
            $ref: '#/components/schemas/SpreadsheetImportPreviewRow'
        truncated:
          type: boolean
      required:
        - totalRows
        - importableRows
        - duplicateRows
        - needsAttentionRows
        - excludedRows
        - detectedCurrencies
        - totalAmount
        - rows
        - truncated
