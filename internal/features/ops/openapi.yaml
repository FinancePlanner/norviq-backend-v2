          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/CsvImportPreviewItem'
        confirmMergeExisting:
          type: boolean
          default: false
          description: >-
            Permission to absorb same-symbol holdings this import did not
            create, such as one the user added by hand. Absent or false, a
