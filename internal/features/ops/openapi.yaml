  /v1/brokers/import/csv:
    post:
      operationId: importBrokersCsvPreview
      tags: [Brokers]
      summary: Upload a CSV and preview parsed rows
      security:
        - bearerAuth: []
      parameters:
        - name: provider
          in: query
          required: true
          description: Broker provider slug. `pilot` is reserved for simulated pilot-follow accounts and is rejected with 400.
          schema:
            type: string
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvImportPreviewResponse'
  /v1/brokers/import/csv/commit:
    post:
      operationId: importBrokersCsvCommit
      tags: [Brokers]
      summary: Upload a CSV and upsert stocks
      security:
        - bearerAuth: []
      parameters:
        - name: provider
          in: query
          required: true
          description: Broker provider slug. `pilot` is reserved for simulated pilot-follow accounts and is rejected with 400.
          schema:
            type: string
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvImportCommitResponse'
        '409':
          description: >
            Two conflicts share this status. "This portfolio is managed by a pilot follow. Stop
            following to edit it." when the target portfolio has a pilot follow (nothing is
            written). "These holdings already exist and were not created by this import: …" when
            hand-added or other-broker holdings of the same symbols exist; retry with
            `confirmMergeExisting=true` to replace them.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorEnvelope'
  /v1/brokers/import/screenshot:
    post:
      operationId: importBrokersScreenshotPreview
      tags: [Brokers]
      summary: Upload broker screenshots and preview extracted positions
      description: >
        Reads up to three broker screenshots with a vision model and returns
        editable rows for review. Requires the screenshot_import entitlement and
        is first-party only, because each image spends an AI call. The images
        are never stored; they are sent to the model and discarded.
      security:
        - bearerAuth: []
      parameters:
        - name: provider
          in: query
          required: true
          schema:
            type: string
        - name: portfolioListId
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: array
                  maxItems: 3
                  items:
                    type: string
                    format: binary
              required: [file]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreenshotImportPreviewResponse'
        '503':
          description: Screenshot import is not configured on this deployment.
  /v1/brokers/import/screenshot/commit:
    post:
      operationId: importBrokersScreenshotCommit
      tags: [Brokers]
      summary: Commit the reviewed rows from a screenshot import
      description: >
        Takes the rows the user approved, not the images. Extraction already
        happened at preview time and is not repeated, so this costs no AI call.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScreenshotImportCommitRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvImportCommitResponse'
        '409':
          description: >
            Two conflicts share this status. "This portfolio is managed by a pilot follow. Stop
            following to edit it." when the target portfolio has a pilot follow (nothing is
            written). "These holdings already exist and were not created by this import: …" when
            hand-added or other-broker holdings of the same symbols exist; resend with
            `confirmMergeExisting: true` to replace them.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorEnvelope'
