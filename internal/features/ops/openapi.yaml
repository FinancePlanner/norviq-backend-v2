    SpreadsheetImportField:
      type: string
      description: What a spreadsheet column maps to on an expense.
      enum: [title, amount, date, category, pillar, notes, currency, externalId, ignore, unknown]
    SpreadsheetMappingSource:
      type: string
      description: Where a mapping decision came from.
      enum: [heuristic, ai, user, unknown]
    SpreadsheetImportAmountSign:
      type: string
      description: How the amount column encodes an expense.
      enum: [positiveIsExpense, negativeIsExpense, separateDebitCredit]
    SpreadsheetImportRowStatus:
      type: string
      description: Per-row verdict. Only `ok` rows are written on commit.
      enum:
        - ok
        - duplicateInFile
        - duplicateExisting
        - invalidDate
        - invalidAmount
        - missingTitle
        - needsCategory
        - needsExchangeRate
        - aggregateRow
        - skippedByUser
        - unknown
    SpreadsheetImportColumn:
      type: object
      properties:
        letter:
          type: string
          description: Spreadsheet column letter, e.g. "G".
        header:
          type: string
          nullable: true
        detectedType:
          type: string
        sampleValues:
          type: array
          items:
            type: string
        field:
          $ref: '#/components/schemas/SpreadsheetImportField'
        confidence:
          type: number
          format: double
        source:
          $ref: '#/components/schemas/SpreadsheetMappingSource'
      required: [letter, detectedType, sampleValues, field, confidence, source]
    SpreadsheetImportSheet:
      type: object
      properties:
        name:
          type: string
        index:
          type: integer
        rowCount:
          type: integer
        headerRow:
          type: integer
          description: 1-based. Frequently not row 1.
        dataStartRow:
          type: integer
        dataEndRow:
          type: integer
        include:
          type: boolean
        isRecommended:
          type: boolean
        columns:
          type: array
          items:
            $ref: '#/components/schemas/SpreadsheetImportColumn'
        excludedRows:
          type: array
          description: Rows excluded up front, such as totals.
          items:
            type: integer
        notes:
          type: array
          items:
            type: string
      required:
        - name
        - index
        - rowCount
        - headerRow
        - dataStartRow
        - dataEndRow
        - include
        - isRecommended
        - columns
        - excludedRows
        - notes
    SpreadsheetImportCategoryMapping:
      type: object
      description: >-
        Maps one distinct value of the source category column onto Norviq's
        model. `pillar` is null when the server could not match it; the user
        decides rather than the server inventing one.
      properties:
        sourceValue:
          type: string
        pillar:
          type: string
          nullable: true
        categoryId:
          type: string
          nullable: true
        categoryName:
          type: string
          nullable: true
        createCategory:
          type: boolean
        confidence:
          type: number
          format: double
        source:
          $ref: '#/components/schemas/SpreadsheetMappingSource'
      required: [sourceValue, createCategory, confidence, source]
    SpreadsheetImportPreviewRow:
      type: object
      properties:
        sheetName:
          type: string
        row:
          type: integer
          description: 1-based worksheet row, matching what the user sees in Excel.
        title:
          type: string
          nullable: true
        amount:
          type: number
          format: double
          nullable: true
        currency:
          type: string
          nullable: true
        occurredOn:
          type: string
          nullable: true
