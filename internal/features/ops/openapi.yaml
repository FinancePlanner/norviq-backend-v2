  /v1/expenses/import/spreadsheet:
    post:
      operationId: analyzeExpenseSpreadsheet
      tags: [Expenses]
      summary: Upload a spreadsheet and get a proposed mapping
      description: >-
        Parses an .xlsx workbook, proposes a column and category mapping, and
        opens a short-lived import session. Pro feature — requires the
        spreadsheet_import entitlement. The uploaded file is never stored; the
        parsed rows are held encrypted for one hour so the mapping can be
        revised without re-uploading. Legacy .xls is not supported.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpreadsheetImportAnalysisResponse'
        '400':
          description: Unreadable, password-protected, or contains no expense table
        '401':
          description: Unauthorized
        '402':
          description: Pro entitlement required
        '413':
          description: Spreadsheet exceeds the size limit
        '415':
          description: Legacy .xls — re-save as .xlsx
        '429':
          description: Rate limit or daily AI limit reached

  /v1/expenses/import/spreadsheet/{sessionId}:
    get:
      operationId: getExpenseSpreadsheetImport
      tags: [Expenses]
      summary: Resume an import session
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpreadsheetImportAnalysisResponse'
        '401':
          description: Unauthorized
        '404':
          description: Session missing or expired
        '409':
          description: Session already committed
    delete:
      operationId: discardExpenseSpreadsheetImport
      tags: [Expenses]
      summary: Cancel an import and delete its stored rows
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized

  /v1/expenses/import/spreadsheet/{sessionId}/preview:
    post:
      operationId: previewExpenseSpreadsheetImport
      tags: [Expenses]
      summary: Re-derive the preview after a mapping change
      description: >-
        Applies the user's decisions to the stored rows and returns what would
        be imported. Makes no AI call and writes no expenses.
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpreadsheetImportDecisionRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
