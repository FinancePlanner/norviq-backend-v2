    TechnicalMACD:
      type: object
      properties:
        line:
          type: number
          format: double
          description: 12-period EMA minus 26-period EMA.
        signal:
          type: number
          format: double
          description: 9-period EMA of `line`.
        histogram:
          type: number
          format: double
          description: '`line` minus `signal`.'
        sign:
          type: string
          enum: [positive, negative]
          description: Sign of the histogram, i.e. the line against its own signal.
      required: [line, signal, histogram, sign]
    TechnicalFiftyTwoWeek:
      type: object
      properties:
        high:
          type: number
          format: double
        low:
          type: number
          format: double
        positionPct:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: Where the last close sits between `low` and `high`. A flat range reports 50.
      required: [high, low, positionPct]
    TechnicalSignalsResponse:
      type: object
      properties:
        symbol:
          type: string
        asOf:
          type: string
          format: date
          description: Date of the last candle used.
        close:
          type: number
          format: double
        sma50:
          type: number
          format: double
          nullable: true
          description: Null until 50 sessions are available.
        sma200:
          type: number
          format: double
          nullable: true
          description: Null until 200 sessions are available.
        trend:
          type: string
          enum: [aboveBoth, belowBoth, mixed]
          description: Where the last close sits relative to both averages. `mixed` also covers "not knowable yet".
        cross:
          type: string
          enum: [goldenCross, deathCross, none]
          description: Whether the 50/200 relationship flipped within the last 10 sessions. `none` means no flip in that window.
        rsi14:
          type: number
          format: double
          nullable: true
          description: Wilder-smoothed 14-period RSI. Null until 15 sessions are available.
        macd:
          allOf:
            - $ref: '#/components/schemas/TechnicalMACD'
          nullable: true
          description: Null until 34 sessions are available.
        fiftyTwoWeek:
          $ref: '#/components/schemas/TechnicalFiftyTwoWeek'
      required: [symbol, asOf, close, trend, cross, fiftyTwoWeek]
    InsiderTrade:
      type: object
      properties:
        date:
          type: string
          format: date
          description: Transaction date.
        reporterName:
          type: string
          description: The reporting insider's name as filed, or `Undisclosed insider` when the filing carried none.
        reporterTitle:
          type: string
          nullable: true
          description: The reporter's relationship to the issuer, as filed. Free text.
        transactionType:
          type: string
          description: The SEC transaction code exactly as it arrived, e.g. `P-Purchase`. Empty when the row had none.
        kind:
          type: string
          enum: [buy, sell, award, other]
          description: >-
            `transactionType` reduced to four categories by its leading letter — `P` is buy, `S` is sell, `A` is
            award. `other` covers everything else (gifts, exempt dispositions, in-kind transfers) and a row with no
            code at all.
        shares:
          type: number
          format: double
        pricePerShare:
          type: number
          format: double
          nullable: true
          description: Null when the filing carried no price, which is normal for awards and gifts.
        value:
          type: number
          format: double
          nullable: true
          description: '`shares` × `pricePerShare`. Null whenever `pricePerShare` is.'
        sharesOwnedAfter:
          type: number
          format: double
          nullable: true
        filingURL:
          type: string
          nullable: true
      required: [date, reporterName, transactionType, kind, shares]
    InsiderActivitySummary:
      type: object
      properties:
        buys:
          type: integer
          description: Number of `buy` filings in the window.
        sells:
          type: integer
          description: Number of `sell` filings in the window.
        netShares:
          type: number
          format: double
          description: >-
            Bought shares minus sold shares. Awards and other non-market transactions move neither this nor
            `netValue`: a grant is compensation, not a view on the price.
        netValue:
          type: number
          format: double
          description: >-
            Bought value minus sold value. Trades whose filing carried no price contribute 0, so this is a floor on
            the real flow rather than a complete total.
      required: [buys, sells, netShares, netValue]
    ClusterBuySignal:
      type: object
      properties:
        insiderCount:
          type: integer
          minimum: 3
          description: Distinct reporters who bought inside the window.
        windowStart:
          type: string
          format: date
          description: Date of the earliest qualifying buy.
        windowEnd:
          type: string
          format: date
          description: Date of the latest qualifying buy.
        totalValue:
          type: number
          format: double
          description: >-
            Sum of the qualifying buys' values. Buys whose filing carried no price contribute 0, so this can be 0
            even for a real cluster.
      required: [insiderCount, windowStart, windowEnd, totalValue]
    InsiderActivityResponse:
      type: object
      properties:
        symbol:
          type: string
        windowDays:
          type: integer
          description: The window actually used, after clamping the request to 30…1825.
        trades:
          type: array
          description: >-
            Filings inside the window, newest transaction first. Empty when the symbol has none, and also when the
            upstream plan does not cover insider data.
          items:
            $ref: '#/components/schemas/InsiderTrade'
        summary:
          $ref: '#/components/schemas/InsiderActivitySummary'
        clusterBuy:
          allOf:
            - $ref: '#/components/schemas/ClusterBuySignal'
          nullable: true
          description: >-
            Null unless some 30-day span inside the window holds open-market buys by three or more distinct
            reporters. When several spans qualify, the most recent one is reported.
      required: [symbol, windowDays, trades, summary]
    CongressTrade:
      type: object
      properties:
        chamber:
          type: string
          enum: [senate, house]
        politician:
          type: string
          description: The filer's name, or `Unknown` when the disclosure carried no name fields.
        party:
          type: string
          nullable: true
          description: Party as filed. Null when the disclosure feed does not carry one, which is the common case.
        state:
          type: string
          nullable: true
          description: >-
            Two-letter state code, from the filing's state field or the leading two letters of a house district like
            `TX07`. Null when neither is present.
        symbol:
          type: string
        transactionDate:
          type: string
          format: date
        disclosureDate:
          type: string
          description: '`YYYY-MM-DD`, or empty when the filing carried no disclosure date.'
        type:
          type: string
          enum: [purchase, sale, exchange, other]
          description: '`other` covers receipts, transfers and a row with no type at all.'
        amountRange:
          type: string
          description: >-
            The bracket exactly as disclosed, e.g. `$1,001 - $15,000`. Congressional disclosures report a range,
            never an amount. Empty when the filing carried none.
        amountMin:
          type: number
          format: double
          nullable: true
          description: Lower bound of `amountRange`. Null for an open-below bracket, or when the text held no figure.
        amountMax:
          type: number
          format: double
          nullable: true
          description: >-
            Upper bound of `amountRange`. Null for an open-above bracket such as `Over $50,000,000`, or when the text
            held no figure.
        assetDescription:
          type: string
          nullable: true
        link:
          type: string
          nullable: true
      required: [chamber, politician, symbol, transactionDate, disclosureDate, type, amountRange]
    CongressTradesResponse:
      type: object
      properties:
        trades:
          type: array
          description: >-
            Both chambers merged, newest transaction first, ties broken on the disclosure date. Empty when there are
            no disclosures, and also when the upstream plan does not cover them.
