  /v1/pilot-follows:
    get:
      operationId: listPilotFollows
      tags: [Pilots]
      summary: List pilot follows
      description: The authenticated user's follows, newest first.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PilotFollowResponse'
        '401':
          description: Unauthorized
        '404':
          description: Not found, or the pilots feature is disabled (`PILOTS_ENABLED` off).
    post:
      operationId: createPilotFollow
      tags: [Pilots]
      summary: Follow a pilot
      description: Starts a simulated follow into an empty watchlist or an empty hypothetical portfolio (or a new one Norviq creates). No real money is invested.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PilotFollowCreateRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PilotFollowResponse'
        '401':
          description: Unauthorized
        '400':
          description: Invalid starting capital.
        '403':
          description: >
            A plan upgrade is required for this follow (BillingUpgradeRequiredResponse), or a
            personal access or OAuth token lacks the scope for the target: `holdings:write` for a
            portfolio follow, `watchlist:write` for a watchlist follow (on top of the route's
            `portfolio:write`), answered as `insufficient_scope: '<scope>' required`
            (APIErrorEnvelope). First-party sessions carry every scope.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BillingUpgradeRequiredResponse'
                  - $ref: '#/components/schemas/APIErrorEnvelope'
        '404':
          description: Pilot or target list not found, or the pilots feature is disabled (`PILOTS_ENABLED` off).
        '409':
          description: The pilot has no book yet.
        '422':
          description: The target is not an empty hypothetical portfolio (it has stocks, cash, transactions, cash positions or an existing follow), or the chosen watchlist has items or an existing follow.

