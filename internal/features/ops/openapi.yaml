  /v1/market/institutional/{symbol}:
    parameters:
      - name: symbol
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getInstitutionalOwnership
      tags: [MarketData]
      summary: Get 13F institutional ownership for a symbol
      description: >-
        Returns the ten largest 13F holders of the symbol, largest first, plus the ownership totals for the same
        quarter. 13Fs are filed after a quarter closes, so `asOfQuarter` is never the current quarter; when the most
        recently closed quarter has no filings yet the previous one is used. The holder list and the totals are two
        separate upstream calls and either may be missing: `topHolders` can be empty while the totals are populated,
        and the three totals can be null while holders are listed. Both are also empty or null when the upstream plan
        does not cover ownership data. Cached for six hours (`MARKET_TTL_OWNERSHIP_SECONDS`).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionalOwnershipResponse'
        '400':
          description: Missing or invalid symbol
        '401':
          description: Unauthorized
        '503':
          description: Market data provider unavailable or misconfigured
