    EarningsResponse:
      type: object
      properties:
        symbol: { type: string }
        date: { type: string, format: date }
        epsActual: { type: number, format: double, nullable: true }
        epsEstimated: { type: number, format: double, nullable: true }
        revenueActual: { type: number, format: double, nullable: true }
        revenueEstimated: { type: number, format: double, nullable: true }
        lastUpdated: { type: string, format: date, nullable: true }
        surprisePercent: { type: number, format: double, nullable: true }
        hasTranscript: { type: boolean }
        beatStreak:
          type: integer
          minimum: 0
          description: >-
            The beat run ending at THIS row: consecutive reported quarters, this one included,
            where EPS came in at or above the estimate. At most one of `beatStreak` and
            `missStreak` is non-zero. Both zero means this row has no comparable result — it has
            not reported (no actual, or no estimate to compare against), or it is a row from the
            cross-symbol `getMarketEarningsCalendar`, which belongs to no single symbol's run.
            Both zero does NOT mean the quarter missed; a miss is `missStreak >= 1`. The symbol's
            headline run is the first row with a non-zero streak, which is usually not the first
            row of the response, because the newest row is typically the next scheduled quarter
            at 0/0.
        missStreak:
          type: integer
          minimum: 0
          description: >-
            The miss run ending at THIS row: consecutive reported quarters, this one included,
            where EPS came in below the estimate. Same invariant as `beatStreak` — at most one of
            the two is non-zero, and both zero means this row carries no comparable result rather
            than a beat.
      required: [symbol, date, hasTranscript, beatStreak, missStreak]
    RecentEarningsResponse:
      type: object
      description: >-
        `nextScheduled` is the next quarter the provider lists but has not reported yet. It is never
        one of `quarters`, so it cannot displace a reported quarter, and the key is omitted entirely
        (not set to null) when the provider lists no such quarter. A date that has only just passed
        can still appear there: providers leave a scheduled date in place for a while after it, and a
        next-report line should still show it. The one exception is a symbol with nothing reported at
        all, where there is no last report to anchor to and only a quarter dated today or later
        qualifies.
      properties:
        symbol: { type: string }
        quarters:
          type: array
          description: >-
            The most recently reported quarters, newest first, at most four of them. A quarter counts
            as reported when it carries both an EPS actual and an EPS estimate. An empty array means
            the provider returned no such quarter for this symbol — a newly listed company, or a
            symbol it does not cover. That is a real answer, not an error, and not a statement that
            the company has never reported.
          items:
            $ref: '#/components/schemas/RecentEarningsQuarter'
        nextScheduled:
          $ref: '#/components/schemas/RecentEarningsQuarter'
      required: [symbol, quarters]
    RecentEarningsQuarter:
      type: object
      properties:
        date: { type: string, format: date }
        epsEstimated: { type: number, format: double, nullable: true }
        epsActual:
          type: number
          format: double
          nullable: true
          description: >-
            The EPS the company reported, or null when the provider has not reported one. Usually
            null when `status` is `scheduled`, but NOT guaranteed: a quarter is `scheduled` when
            either side of the comparison is missing, so a row the provider lists with an actual and
            no estimate is `scheduled` and carries that actual. Branch on `status`, not on whether
            this field is null.
        surprisePercent:
          type: number
          format: double
          nullable: true
          description: >-
            How far the actual came in above (positive) or below (negative) the estimate, in percent.
            Null when either side is missing or the estimate is zero.
        hasTranscript:
          type: boolean
          description: >-
            Whether the provider lists an earnings call transcript for this quarter. An availability
            flag only — the transcript text is never included in this response, and fetching it needs
            the premium `getMarketEarningsTranscript` route.
        status:
          type: string
          enum: [reported, scheduled]
          description: >-
            `reported` when both an EPS actual and an EPS estimate are present, so the quarter has a
            comparable result; `scheduled` otherwise — the provider lists the quarter but not a
            comparable result for it. This is the field to branch on, rather than the nullability of
            `epsActual` or `epsEstimated`.
        beatStreak:
          type: integer
          minimum: 0
          description: >-
            The beat run ending at THIS row: consecutive reported quarters, this one included, where
            EPS came in at or above the estimate. At most one of `beatStreak` and `missStreak` is
            non-zero. Both zero means this row has no comparable result — the normal state of a
            `scheduled` row. Both zero does NOT mean the quarter missed; a miss is `missStreak >= 1`.
            Counted over the symbol's whole earnings history rather than only the rows returned here,
            so the numbers match what `getMarketEarnings` reports for the same quarters.
        missStreak:
          type: integer
          minimum: 0
          description: >-
            The miss run ending at THIS row: consecutive reported quarters, this one included, where
            EPS came in below the estimate. Same invariant as `beatStreak` — at most one of the two is
            non-zero, and both zero means this row carries no comparable result rather than a beat.
      required: [date, hasTranscript, status, beatStreak, missStreak]
