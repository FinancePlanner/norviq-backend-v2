        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getMarketRecentEarnings
      tags: [MarketData]
      summary: Get the recent-earnings teaser for a symbol
      description: >-
        The un-gated slice of a symbol's earnings history, for pages that are open to the internet:
        up to four of its most recently reported quarters, and the next quarter the provider has
        scheduled when it lists one. Either part can be empty — a symbol with nothing reported yet
        returns `quarters: []`, and `nextScheduled` is omitted when there is no upcoming quarter to
        name. Unlike `getMarketEarnings`, this route requires no premium entitlement — a session or a
        `market:read` personal access token is enough. It never returns earnings call transcript
        text; `hasTranscript` says only whether a transcript exists, and `getMarketEarningsTranscript`
        remains premium-only. Cached for `MARKET_TTL_RECENT_EARNINGS_SECONDS` (default 3600). On
        limited FMP plans, unsupported symbols return `402 Payment Required`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecentEarningsResponse'
        '400':
          description: Missing or empty symbol
        '401':
          description: Unauthorized
        '402':
          description: Paid FMP plan required for this symbol
        '404':
          description: Not Found or provider missing data
        '502':
          description: Bad Gateway for FMP provider
        '503':
          description: FMP provider unavailable or misconfigured

