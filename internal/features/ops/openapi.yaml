      operationId: macroFedWatch
      summary: Fed Watch — Core PCE vs 2% target, trimmed mean, treasury yields, next FOMC
      description: US-only. Assembled from stored FRED points (`PCEPILFE`, `TRMMEANCPIM158SFRBCLE`, `DGS2`, `DGS10`, `DFII10`, `T10YIE`). FOMC meeting odds are not populated (no free odds API).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Fed Watch snapshot
          content:
            application/json:
