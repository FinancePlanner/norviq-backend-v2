    RecapSlide:
      description: >-
        Tagged union. `type` names the case (`top_tickers` and `missed_you` are
        snake_case values) and the case payload always sits under the fixed key
        `payload`, whose fields are camelCase.
      oneOf:
        - $ref: '#/components/schemas/RecapSlide_intro'
        - $ref: '#/components/schemas/RecapSlide_streak'
        - $ref: '#/components/schemas/RecapSlide_top_tickers'
        - $ref: '#/components/schemas/RecapSlide_trades'
        - $ref: '#/components/schemas/RecapSlide_research'
        - $ref: '#/components/schemas/RecapSlide_growth'
        - $ref: '#/components/schemas/RecapSlide_dividends'
        - $ref: '#/components/schemas/RecapSlide_goals'
        - $ref: '#/components/schemas/RecapSlide_badges'
        - $ref: '#/components/schemas/RecapSlide_personality'
        - $ref: '#/components/schemas/RecapSlide_missed_you'
        - $ref: '#/components/schemas/RecapSlide_outro'
      discriminator:
        propertyName: type
        mapping:
          intro: '#/components/schemas/RecapSlide_intro'
          streak: '#/components/schemas/RecapSlide_streak'
          top_tickers: '#/components/schemas/RecapSlide_top_tickers'
          trades: '#/components/schemas/RecapSlide_trades'
          research: '#/components/schemas/RecapSlide_research'
          growth: '#/components/schemas/RecapSlide_growth'
          dividends: '#/components/schemas/RecapSlide_dividends'
          goals: '#/components/schemas/RecapSlide_goals'
          badges: '#/components/schemas/RecapSlide_badges'
          personality: '#/components/schemas/RecapSlide_personality'
          missed_you: '#/components/schemas/RecapSlide_missed_you'
          outro: '#/components/schemas/RecapSlide_outro'
    RecapSlide_intro:
      type: object
      required: [type, payload]
      properties:
        type: { type: string, enum: [intro] }
        payload: { $ref: '#/components/schemas/RecapIntroSlide' }
    RecapSlide_streak:
