          type: string
    get:
      operationId: getMarketTechnicals
      tags: [MarketData]
      summary: Get technical signals for a symbol
      description: Returns trend, momentum, and 52-week range signals derived from up to 300 trailing daily closes of the backend's cached price history. Indicators without enough sessions are `null` rather than approximated. Cached for an hour (`MARKET_TTL_TECHNICALS_SECONDS`).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
