services:
  postgres:
    # Same major as production (platform/infra apps/norviq/data/postgres.yaml).
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: vapor_username
      POSTGRES_PASSWORD: vapor_password
      POSTGRES_DB: vapor_database
    ports:
      - "55499:5432"
    volumes:
      # Postgres 18+ images keep data in a major-versioned subdirectory of
      # /var/lib/postgresql, so the volume mounts there. The volume name carries
      # the major: a pg17 volume cannot be opened by pg18, and a fresh name
      # leaves the old one alone instead of crashlooping on it.
      - postgres-data-18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vapor_username -d vapor_database"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["migrate", "--yes"]
    environment: &database
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: vapor_username
      DATABASE_PASSWORD: vapor_password
      DATABASE_NAME: vapor_database
      DATABASE_SSLMODE: disable
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["migrate"]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["serve"]
    environment:
      <<: *database
      APP_ENV: development
      PORT: 8080
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-secret-change-me
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data-18:
