    get:
      tags: [Macro]
      operationId: macroPolicyWatch
      summary: Policy watch (Fed / ECB / Bacen) — country-aware rates context
      description: |
        US maps from Fed Watch plus Fed funds upper bound. EA/BR use headline inflation
        vs target plus policy rate. Meeting odds stay null (no free licensed feed).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MacroCountryParam'
      responses:
        '200':
          description: Policy watch snapshot
