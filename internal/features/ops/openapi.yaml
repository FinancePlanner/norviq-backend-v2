        '401': { description: Missing or invalid authentication token }
  /v1/articles:
    get:
      operationId: listArticles
      tags: [Articles]
      summary: List articles
      description: Published articles, newest first, cursor-paginated.
      security:
        - bearerAuth: []
      parameters:
        - { name: ticker, in: query, required: false, description: "Only articles tagged with this ticker.", schema: { type: string } }
        - { name: author, in: query, required: false, description: "Only articles by this username.", schema: { type: string } }
        - { name: cursor, in: query, required: false, description: "`nextCursor` from the previous page.", schema: { type: string } }
        - { name: limit, in: query, required: false, description: "Page size (default 20, clamped to 1-100).", schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleListResponse'
        '400':
          description: Invalid `ticker` value.
        '401':
          description: Unauthorized
        '404':
          description: Not found, or the articles feature is disabled (`ARTICLES_ENABLED` off).
    post:
      operationId: createArticle
      tags: [Articles]
      summary: Publish an article
      description: Creates and publishes an article. Limited to 3 per day for non-admins.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleWriteRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleDetail'
        '400':
          description: Invalid title, body, bullet points, tickers, disclosure or cover image
        '403':
          description: Forbidden. Error code `community_muted`, `username_required` or `guidelines_required`.
        '429':
          description: Daily publishing limit reached (error code `article_daily_limit`), or rate limited
        '401':
          description: Unauthorized
        '404':
          description: Not found, or the articles feature is disabled (`ARTICLES_ENABLED` off).

  /v1/articles/{ref}:
    get:
      operationId: getArticle
      tags: [Articles]
      summary: Get an article
      description: Full article by UUID or short code.
      security:
        - bearerAuth: []
      parameters:
        - name: ref
          in: path
          required: true
          description: Article UUID or 8-character short code.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleDetail'
        '401':
          description: Unauthorized
        '404':
          description: Not found, or the articles feature is disabled (`ARTICLES_ENABLED` off).
    patch:
      operationId: updateArticle
      tags: [Articles]
      summary: Update an article
      description: Full replace of the article's content; `source` is ignored. Author only.
      security:
        - bearerAuth: []
      parameters:
        - name: ref
          in: path
          required: true
          description: Article UUID or 8-character short code.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleWriteRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleDetail'
        '400':
          description: Invalid content
        '403':
          description: Not the author, or muted, banned (`community_banned`), missing username or guidelines not accepted
        '429':
          description: Rate limited.
        '401':
          description: Unauthorized
        '404':
          description: Not found, or the articles feature is disabled (`ARTICLES_ENABLED` off).
    delete:
      operationId: deleteArticle
      tags: [Articles]
      summary: Delete an article
      description: Soft delete. Author or admin.
      security:
        - bearerAuth: []
      parameters:
        - name: ref
          in: path
          required: true
          description: Article UUID or 8-character short code.
          schema:
            type: string
      responses:
        '204':
          description: No content
        '403':
          description: Not the author or an admin, or banned (`community_banned`)
        '401':
          description: Unauthorized
        '404':
          description: Not found, or the articles feature is disabled (`ARTICLES_ENABLED` off).

  /v1/articles/{ref}/vote:
    post:
      operationId: voteArticle
      tags: [Articles]
      summary: Upvote an article
      description: Idempotent.
      security:
        - bearerAuth: []
      parameters:
        - name: ref
          in: path
          required: true
          description: Article UUID or 8-character short code.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleVoteResponse'
        '403':
          description: Muted, banned (`community_banned`), missing username or guidelines not accepted
        '429':
          description: Rate limited.
        '401':
          description: Unauthorized
        '404':
          description: Not found, or the articles feature is disabled (`ARTICLES_ENABLED` off).
    delete:
      operationId: unvoteArticle
      tags: [Articles]
      summary: Remove an upvote
      description: Idempotent.
      security:
        - bearerAuth: []
      parameters:
        - name: ref
          in: path
          required: true
          description: Article UUID or 8-character short code.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleVoteResponse'
        '403':
          description: Muted, banned (`community_banned`), missing username or guidelines not accepted
        '429':
          description: Rate limited.
        '401':
          description: Unauthorized
        '404':
          description: Not found, or the articles feature is disabled (`ARTICLES_ENABLED` off).

  /v1/articles/{ref}/view:
    post:
      operationId: recordArticleView
      tags: [Articles]
      summary: Record an article view
      description: Counts at most one view per viewer per UTC day. A first-party session is keyed by user. The `X-Norviq-Viewer` header is honored only from the web's own credential (listed in `ARTICLES_VIEWER_CREDENTIAL_IDS`), which is also exempt from the per-user rate limit; any other third-party credential counts nothing. Uncounted calls still return 204.
      security:
        - bearerAuth: []
      parameters:
        - name: ref
          in: path
          required: true
          description: Article UUID or 8-character short code.
          schema:
            type: string
        - name: X-Norviq-Viewer
          in: header
          required: false
          description: Hashed visitor key (16-64 hex characters) forwarded by the web for logged-out visitors. Ignored unless the caller is a listed web credential.
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{16,64}$'
      responses:
        '204':
          description: No content
        '429':
          description: Rate limited.
        '401':
          description: Unauthorized
        '404':
          description: Not found, or the articles feature is disabled (`ARTICLES_ENABLED` off).

  /v1/articles/{ref}/report:
    post:
      operationId: reportArticle
      tags: [Articles]
      summary: Report an article
      description: Files a report for moderators. Allowed while muted.
      security:
        - bearerAuth: []
      parameters:
        - name: ref
          in: path
          required: true
          description: Article UUID or 8-character short code.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleReportRequest'
      responses:
        '204':
          description: No content
        '400':
          description: Invalid reason or note over 1,000 characters
        '403':
          description: Banned from the community (error code `community_banned`).
        '429':
          description: Rate limited.
        '401':
          description: Unauthorized
        '404':
          description: Not found, or the articles feature is disabled (`ARTICLES_ENABLED` off).

  /v1/articles/images:
    post:
      operationId: uploadArticleImage
      tags: [Articles]
      summary: Upload an article image
      description: PNG, JPEG or WebP, up to 2 MB and at most 4096 px per side, and at most 10 uploads per rolling 24 hours (admins exempt). Use the returned id as `coverImageId`. Each upload deletes the caller's images older than 24 hours that no article uses as its cover.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleImageUploadResponse'
        '400':
          description: Missing or unreadable file, a damaged image, or a side over 4096 px
        '403':
          description: Muted, banned (`community_banned`), missing username or guidelines not accepted
        '413':
          description: Image larger than 2 MB
        '415':
          description: Unsupported image type
        '429':
          description: Rate limited, or 10 uploads in the last 24 hours (error code `article_image_daily_limit`).
        '401':
          description: Unauthorized
        '404':
          description: Not found, or the articles feature is disabled (`ARTICLES_ENABLED` off).

  /v1/articles/images/{imageId}:
    get:
      operationId: getArticleImage
      tags: [Articles]
      summary: Get an article image
      description: Served while a published article uses the image as its cover (`Cache-Control public, max-age=86400`). Otherwise only to the owner's or an admin's own first-party session (`Cache-Control private, no-store`); a third-party credential, or anyone else, gets 404.
      security:
        - bearerAuth: []
      parameters:
        - name: imageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Image bytes
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        '401':
          description: Unauthorized
        '404':
          description: Not found, not the cover of a published article (for anyone but its owner or an admin), or the articles feature is disabled (`ARTICLES_ENABLED` off).

  /v1/admin/articles/{ref}/visibility:
    put:
      operationId: setArticleVisibility
      tags: [Articles]
      summary: Hide or unhide an article
      description: Admin only.
      security:
        - bearerAuth: []
      parameters:
        - name: ref
          in: path
          required: true
          description: Article UUID or 8-character short code.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleVisibilityRequest'
      responses:
        '204':
          description: No content
        '403':
          description: Admin access required
        '401':
          description: Unauthorized
        '404':
          description: Not found, or the articles feature is disabled (`ARTICLES_ENABLED` off).

  /v1/recaps:
    get:
      operationId: listRecaps
      tags: [Recaps]
      summary: List recaps
      description: >-
        Stored recaps plus the last closed month (and year, when yearly is on) if
        not generated yet. 404 while `RECAP_ENABLED` is off.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecapListResponse' }
        '401': { description: Unauthorized }
        '403': { description: Token lacks planning:read }
        '404': { description: Recaps are disabled }
  /v1/recaps/{kind}/{key}:
    get:
      operationId: getRecap
      tags: [Recaps]
      summary: Get (and generate once) a recap
      description: >-
        `kind` is `month` (key `YYYY-MM`) or `year` (key `YYYY`). Generated on
        first request and returned unchanged afterwards. 404 for a bad kind or
        key, an unavailable period, or while the feature flag is off.
      security:
        - bearerAuth: []
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [month, year] } }
        - { name: key, in: path, required: true, schema: { type: string, example: '2026-09' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecapResponse' }
        '401': { description: Unauthorized }
        '403': { description: Token lacks planning:read }
        '404': { description: Not available }
  /v1/recaps/{id}/opened:
    post:
      operationId: markRecapOpened
      tags: [Recaps]
      summary: Mark a recap opened
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: No content }
        '401': { description: Unauthorized }
        '403': { description: Token lacks planning:write }
        '404': { description: Unknown or foreign recap or recaps disabled }
  /v1/recaps/{id}/completed:
    post:
      operationId: markRecapCompleted
      tags: [Recaps]
      summary: Mark a recap completed
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: No content }
        '401': { description: Unauthorized }
        '403': { description: Token lacks planning:write }
        '404': { description: Unknown or foreign recap or recaps disabled }

  /v1/digests:
    get:
      operationId: listDigests
      tags: [Digest]
      summary: The user's recent weekly digests
      description: Newest first, at most 12. Only digests that were composed.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigestListResponse'
        '401':
          description: Unauthorized
        '403':
          description: Token lacks the portfolio:read scope
        '404':
          description: Weekly digest is not enabled
  /v1/digests/{digestId}:
    get:
      operationId: getDigest
      tags: [Digest]
      summary: One weekly digest
      description: Another user's digest answers 404, the same as a missing one.
      security:
        - bearerAuth: []
      parameters:
        - name: digestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigestResponse'
        '401':
          description: Unauthorized
        '404':
          description: Not found, or weekly digest is not enabled
  /v1/digest-preferences:
    get:
      operationId: getDigestPreferences
      tags: [Digest, Notifications]
      summary: Weekly digest channels and schedule
      description: >-
        `decided` is false until the user has saved preferences once; clients
        show the opt-in card while it is false.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigestPreferences'
        '401':
          description: Unauthorized
        '403':
          description: Token lacks the notifications:read scope
        '404':
          description: Weekly digest is not enabled
    put:
      operationId: updateDigestPreferences
      tags: [Digest, Notifications]
      summary: Change weekly digest channels or schedule
      description: Only the fields sent are changed. Clients send the device time zone.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DigestPreferencesUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigestPreferences'
        '400':
          description: Invalid weekday, hour, time zone or country
        '401':
          description: Unauthorized
        '403':
          description: Token lacks the notifications:write scope
        '404':
          description: Weekly digest is not enabled
  /v1/digest/unsubscribe:
    post:
      operationId: unsubscribeDigest
      tags: [Digest]
      summary: One-click unsubscribe (RFC 8058)
      description: >-
        Public; the token from the email is the only credential. Turns off the
        email channel only. Always answers 200, whether or not the token matched.
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string, maxLength: 128 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigestUnsubscribeResponse'
        '400':
          description: Missing token
components:
  parameters:
    ScenarioResourceID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    MacroCountryParam:
      name: country
      in: query
      required: false
      schema:
        type: string
        enum: [US, BR, PT, ES, DE, FR, IT, EA]
        default: US
      description: Country code (case-insensitive; `EURO`/`EZ` accepted as aliases for `EA`). Unknown values fall back to US.
  responses:
    PilotManagedPortfolio:
      description: >
        The portfolio is managed by a pilot follow ("This portfolio is managed by a pilot follow.
        Stop following to edit it."). Stop the follow to edit it by hand.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIErrorEnvelope'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    finnhubQueryToken:
      type: apiKey
      in: query
      name: token
      description: Finnhub API key from the Finnhub Dashboard passed as the `token` query parameter. In Bruno, set `FINNHUB_API_KEY`.
    finnhubHeaderToken:
      type: apiKey
      in: header
      name: X-Finnhub-Token
      description: Finnhub API key from the Finnhub Dashboard passed as the `X-Finnhub-Token` header. In Bruno, set `FINNHUB_API_KEY`.
    fmpQueryApiKey:
      type: apiKey
      in: query
      name: apikey
      description: FMP API key passed as the `apikey` query parameter. In Bruno, set `FMP_API_KEY`.
    finnhubWebhookSecretHeader:
      type: apiKey
      in: header
      name: X-Finnhub-Secret
      description: Shared secret for inbound Finnhub webhook delivery. Configure the backend with `FINNHUB_WEBHOOK_SECRET`.
    finnhubWebhookSecretQuery:
      type: apiKey
      in: query
      name: secret
      description: Shared secret for inbound Finnhub webhook delivery when the provider can only append query parameters. Configure the backend with `FINNHUB_WEBHOOK_SECRET`.
    revenueCatWebhookSecret:
      type: apiKey
      in: header
      name: Authorization
      description: Shared secret for inbound RevenueCat webhook delivery. Configure the backend with `REVENUECAT_WEBHOOK_SECRET`.
  schemas:
    TelegramStatusResponse:
      type: object
      required: [available, connected, botUsername]
      properties:
        available: { type: boolean, description: Whether this deployment has a bot configured at all }
        connected: { type: boolean }
        botUsername: { type: string }
        lastSeenAt: { type: string, format: date-time, nullable: true }
        connectedAt: { type: string, format: date-time, nullable: true }
    TelegramCodeResponse:
      type: object
      required: [code, expiresAt, deepLink]
      properties:
        code: { type: string, description: Single-use pairing code, shown once }
        expiresAt: { type: string, format: date-time }
        deepLink: { type: string, description: 'https://t.me/<bot>?start=<code>' }
    TelegramPreferenceItem:
      type: object
      required: [kind, enabled, timezone]
      properties:
        kind: { type: string, enum: [price_target, budget, earnings, tax, watchlist_screen, rebalancing, financial_goal, thesis_watch] }
        enabled: { type: boolean }
        quietHoursStart: { type: integer, minimum: 0, maximum: 23, nullable: true }
        quietHoursEnd: { type: integer, minimum: 0, maximum: 23, nullable: true }
        timezone: { type: string }
    TelegramPreferencesResponse:
      type: object
      required: [preferences]
      properties:
        preferences: { type: array, items: { $ref: '#/components/schemas/TelegramPreferenceItem' } }
    TelegramPreferenceUpdateRequest:
      type: object
      required: [kind, enabled]
      properties:
        kind: { type: string, enum: [price_target, budget, earnings, tax, watchlist_screen, rebalancing, financial_goal, thesis_watch] }
        enabled: { type: boolean }
        quietHoursStart: { type: integer, minimum: 0, maximum: 23, nullable: true }
        quietHoursEnd: { type: integer, minimum: 0, maximum: 23, nullable: true }
        timezone: { type: string }
    UserAIProviderKind:
      type: string
      description: >
        Which upstream a user key talks to. `compatible` is any
        OpenAI-compatible endpoint and requires baseURL and defaultModel.
        Anthropic is reached through its OpenAI-compatible Chat Completions
        endpoint, not the native Messages API.
      enum: [anthropic, openai, compatible]
    UserAIProviderCredentialStatus:
      type: string
      enum: [unverified, active, invalid, disabled]
    UserAIProviderCredential:
      type: object
      description: >
        A stored provider credential. Deliberately has no apiKey field — the
        plaintext is never returned after it is submitted.
      required: [id, provider, label, keyHint, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        provider:
          $ref: '#/components/schemas/UserAIProviderKind'
        label:
          type: string
        keyHint:
          type: string
          description: Last four characters of the key, for telling two apart.
        baseURL:
          type: string
          nullable: true
        defaultModel:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/UserAIProviderCredentialStatus'
        lastVerifiedAt:
          type: string
          format: date-time
          nullable: true
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        lastErrorCode:
          type: string
          nullable: true
          description: Stable code, never provider error text.
          enum: [invalid_key, restricted, rate_limited, unreachable]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UserAIProviderCredentialListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserAIProviderCredential'
    CreateUserAIProviderCredentialRequest:
      type: object
      required: [provider, label, apiKey]
      properties:
        provider:
          $ref: '#/components/schemas/UserAIProviderKind'
        label:
          type: string
          minLength: 1
          maxLength: 100
        apiKey:
          type: string
          minLength: 1
          maxLength: 512
          description: Plaintext key. Stored encrypted and never returned.
        baseURL:
          type: string
          nullable: true
          description: Required for `compatible`. Must be https and must not resolve to a private, loopback, or link-local host.
        defaultModel:
          type: string
          nullable: true
          description: Required for `compatible`.
        verify:
          type: boolean
          default: true
          description: Check the key against the provider before responding.
    VerifyUserAIProviderCredentialResponse:
      type: object
      required: [status, detail, latencyMs]
      properties:
        status:
          $ref: '#/components/schemas/UserAIProviderCredentialStatus'
        verifiedAt:
          type: string
          format: date-time
          nullable: true
        errorCode:
          type: string
          nullable: true
        detail:
          type: string
        latencyMs:
          type: integer
    RebalancingDocument:
      type: object
      description: Rebalancing contract defined in the versioned StockPlanShared package.
      additionalProperties: true
    PortfolioSimulationDocument:
      type: object
      description: Portfolio simulation contract defined in the versioned StockPlanShared package.
      additionalProperties: true
    ScenarioJSON:
      type: object
      additionalProperties: true
      description: >
        Opaque scenario payload. Completed run results may include timeline, maximum_drawdown,
        ending_value, portfolio_change_percent, goal_delay_months, required_monthly_contribution,
        contribution_delta, recovery_months, expense_impact_monthly, goal_probability,
        expected_shortfall, holding_contributions, class_contributions, assumptions, and warnings.
    FinancialGoalInput:
      type: object
      required: [name, goalType, targetAmount, targetDate, baseCurrency, startingCapital, monthlyContribution, annualContributionGrowth, inflationAssumption, riskProfile, status, portfolioAllocations, expenseCategoryLinks]
      properties:
        name: { type: string, minLength: 1 }
        goalType: { type: string, enum: [retirement, home_purchase, financial_independence, education, emergency_fund, investment_target, custom] }
        targetAmount: { type: number, format: double, minimum: 0, exclusiveMinimum: true }
        targetDate: { type: string, format: date }
        baseCurrency: { type: string, minLength: 3, maxLength: 3 }
        startingCapital: { type: number, format: double, minimum: 0 }
        monthlyContribution: { type: number, format: double, minimum: 0 }
        annualContributionGrowth: { type: number, format: double }
        inflationAssumption: { type: number, format: double }
        riskProfile: { type: string, enum: [conservative, moderate, aggressive] }
        expectedAnnualReturn: { type: number, format: double, nullable: true }
        status: { type: string, enum: [active, paused, completed, archived] }
        portfolioAllocations: { type: array, items: { $ref: '#/components/schemas/GoalPortfolioAllocation' } }
        expenseCategoryLinks: { type: array, items: { $ref: '#/components/schemas/GoalExpenseCategoryLink' } }
    FinancialGoal:
      allOf:
        - $ref: '#/components/schemas/FinancialGoalInput'
        - type: object
          required: [id, portfolioListId, expectedAnnualReturn]
          properties:
            id: { type: string, format: uuid }
            portfolioListId: { type: string, format: uuid, description: Legacy primary portfolio retained for scenario compatibility. }
            expectedAnnualReturn: { type: number, format: double }
            createdAt: { type: string, nullable: true }
            updatedAt: { type: string, nullable: true }
    GoalPortfolioAllocation:
      type: object
      required: [id, portfolioListId, allocationPercentage]
      properties:
        id: { type: string, format: uuid }
        portfolioListId: { type: string, format: uuid }
        allocationPercentage: { type: number, format: double, minimum: 0, maximum: 100 }
    GoalExpenseCategoryLink:
      type: object
      required: [id, categoryId, role]
      properties:
        id: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        role: { type: string, enum: [observed_contribution, reduction_candidate] }
    GoalTrajectoryPoint:
      type: object
      required: [date, plannedValue, projectedValue]
      properties:
        date: { type: string, format: date }
        plannedValue: { type: number, format: double }
        actualValue: { type: number, format: double, nullable: true }
        projectedValue: { type: number, format: double }
    GoalProgress:
      type: object
      required: [goalId, currency, currentValue, targetAmount, percentComplete, plannedValueToday, projectedValueAtTarget, driftAmount, driftState, plannedMonthlyContribution, observedMonthlyContribution, trajectory, warnings, calculatedAt]
      properties:
        goalId: { type: string, format: uuid }
        currency: { type: string }
        currentValue: { type: number, format: double }
        targetAmount: { type: number, format: double }
        percentComplete: { type: number, format: double }
        plannedValueToday: { type: number, format: double }
        projectedValueAtTarget: { type: number, format: double }
        projectedCompletionDate: { type: string, format: date, nullable: true }
        driftAmount: { type: number, format: double }
        driftMonths: { type: integer, nullable: true }
        driftState: { type: string, enum: [ahead, on_track, behind, complete, insufficient_data] }
        plannedMonthlyContribution: { type: number, format: double }
        observedMonthlyContribution: { type: number, format: double }
        trajectory: { type: array, items: { $ref: '#/components/schemas/GoalTrajectoryPoint' } }
        warnings: { type: array, items: { type: string } }
        calculatedAt: { type: string, format: date-time }
    GoalOverviewItem:
      type: object
      required: [id, goal, progress]
      properties:
        id: { type: string, format: uuid }
        goal: { $ref: '#/components/schemas/FinancialGoal' }
        progress: { $ref: '#/components/schemas/GoalProgress' }
    GoalOverview:
      type: object
      required: [items, totalCurrentValue, totalTargetAmount, activeGoalCount, isPro]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/GoalOverviewItem' } }
        totalCurrentValue: { type: number, format: double }
        totalTargetAmount: { type: number, format: double }
        activeGoalCount: { type: integer }
        activeGoalLimit: { type: integer, nullable: true }
        isPro: { type: boolean }
    GoalTemplate:
      type: object
      required: [id, name, goalType, suggestedYears, riskProfile]
      properties:
        id: { type: string }
        name: { type: string }
        goalType: { type: string }
        suggestedYears: { type: integer }
        riskProfile: { type: string }
    GoalWhatIfRequest:
      type: object
      properties:
        monthlyContribution: { type: number, format: double, minimum: 0, nullable: true }
        expectedAnnualReturn: { type: number, format: double, nullable: true }
        targetDate: { type: string, format: date, nullable: true }
    GoalWhatIfResponse:
      type: object
      required: [baseline, scenario]
      properties:
        baseline: { $ref: '#/components/schemas/GoalProgress' }
        scenario: { $ref: '#/components/schemas/GoalProgress' }
    GoalContributionInput:
      type: object
      required: [amount, occurredAt]
      properties:
        amount: { type: number, format: double, minimum: 0, exclusiveMinimum: true }
        occurredAt: { type: string, format: date }
        note: { type: string, nullable: true }
    GoalContribution:
      allOf:
        - $ref: '#/components/schemas/GoalContributionInput'
        - type: object
          required: [id, goalId, createdAt]
          properties:
            id: { type: string, format: uuid }
            goalId: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
    GoalSuggestion:
      type: object
      required: [id, goalId, kind, title, explanation, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        goalId: { type: string, format: uuid }
        kind: { type: string, enum: [increase_contribution, reduce_contribution, reduce_spending, extend_target_date, rebalance_allocation] }
        title: { type: string }
        explanation: { type: string }
        monthlyAmount: { type: number, format: double, nullable: true }
        allocationPercentage: { type: number, format: double, nullable: true }
        estimatedMonthsChanged: { type: integer, nullable: true }
        status: { type: string, enum: [proposed, accepted, dismissed] }
        createdAt: { type: string, format: date-time }
    GoalAdjustmentDraft:
      type: object
      required: [id, suggestionId, destination, payload, createdAt]
      properties:
        id: { type: string, format: uuid }
        suggestionId: { type: string, format: uuid }
        destination: { type: string, enum: [budget, rebalancing, goal] }
        payload: { type: object, additionalProperties: { type: string } }
        createdAt: { type: string, format: date-time }
    FinancialGoalBulkUpdate:
      type: object
      required: [goalIds, status]
      properties:
        goalIds: { type: array, minItems: 1, items: { type: string, format: uuid } }
        status: { type: string, enum: [active, paused, completed, archived] }
    ScenarioInput:
      type: object
      required: [portfolioListId, name, kind, configuration]
      properties:
        portfolioListId: { type: string, format: uuid }
        financialGoalId: { type: string, format: uuid, nullable: true }
        name: { type: string, minLength: 1 }
        kind: { type: string, enum: [historical, custom, monte_carlo] }
        configuration: { $ref: '#/components/schemas/ScenarioJSON' }
